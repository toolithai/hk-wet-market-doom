<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>香港夜市 DOOM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated;image-rendering:crisp-edges}
:root{
  --red:#ff2a1a;--amber:#ff9020;--lantern-r:#ff3d18;--lantern-y:#ffde44;
  --pink:#ff3df2;--cyan:#1ef8ff;--yellow:#ffe050;--green:#1dff7b;
  --deep:#07071a;--ink:#020210;--metal:#c8c3b6;--beige:#b8ab96;
  --stripe-w:#e8e4d2;--stripe-r:#c2161b;
  --floor-dark:#060511;--floor-mid:#0e0c18;
}
html,body{width:100%;height:100%;overflow:hidden;background:#020212;font-family:"Courier New",monospace}

/* ── Global pixel scanline overlay ── */
body::after{
  content:"";position:fixed;inset:0;z-index:200;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);
  mix-blend-mode:multiply;
}

/* ══════════════════════════════════
   SCENE ROOT
══════════════════════════════════ */
.scene{
  position:relative;width:100vw;height:100vh;min-height:640px;overflow:hidden;
  background:
    /* lantern warm cone from above-center */
    radial-gradient(ellipse 70% 48% at 50% 22%,rgba(255,90,24,.52) 0,transparent 100%),
    /* left neon leak */
    radial-gradient(ellipse 32% 60% at 3% 45%,rgba(255,61,242,.22),transparent 70%),
    /* right neon leak */
    radial-gradient(ellipse 30% 55% at 97% 38%,rgba(30,248,255,.2),transparent 70%),
    /* sky gradient */
    linear-gradient(180deg,#02020f 0%,#06051a 30%,#0a0818 55%,#060410 100%);
}

/* Vignette */
.vignette{
  position:absolute;inset:0;z-index:190;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.72) 0,transparent 14%,transparent 86%,rgba(0,0,0,.72) 100%),
    linear-gradient(180deg,rgba(0,0,0,.55) 0,transparent 18%,transparent 80%,rgba(0,0,0,.82) 100%);
}

/* ══════════════════════════════════
   DEEP BACKGROUND — night city
══════════════════════════════════ */
.bg{position:absolute;inset:0;z-index:1}

/* City silhouette */
.city{
  position:absolute;left:0;right:0;top:0;
  height:42%;
  background:
    /* building blocks */
    linear-gradient(180deg,transparent 0 26%,#0a0816 26% 100%),
    repeating-linear-gradient(90deg,
      #0a0816 0 22px,transparent 22px 30px,
      #0b0a1c 30px 58px,transparent 58px 64px,
      #080614 64px 100px,transparent 100px 108px,
      #0d0b1e 108px 156px,transparent 156px 162px);
  clip-path:polygon(
    0 100%,0 48%,2% 48%,2% 22%,5% 22%,5% 38%,8% 38%,8% 14%,10% 14%,10% 32%,
    13% 32%,13% 8%,15% 8%,15% 28%,18% 28%,18% 18%,20% 18%,20% 36%,
    23% 36%,23% 12%,25% 12%,25% 30%,28% 30%,28% 6%,30% 6%,30% 26%,
    33% 26%,33% 16%,36% 16%,36% 34%,38% 34%,38% 10%,41% 10%,41% 28%,
    44% 28%,44% 20%,46% 20%,46% 40%,49% 40%,49% 8%,51% 8%,51% 32%,
    54% 32%,54% 18%,56% 18%,56% 28%,59% 28%,59% 12%,62% 12%,62% 30%,
    65% 30%,65% 22%,68% 22%,68% 38%,70% 38%,70% 14%,73% 14%,73% 28%,
    76% 28%,76% 8%,78% 8%,78% 24%,81% 24%,81% 18%,84% 18%,84% 36%,
    87% 36%,87% 12%,89% 12%,89% 30%,92% 30%,92% 20%,95% 20%,95% 42%,
    98% 42%,98% 16%,100% 16%,100% 100%);
}

/* Windows in city */
.windows{
  position:absolute;left:0;right:0;top:0;height:42%;z-index:1;
  background:
    radial-gradient(2px 3px at 9% 18%,rgba(255,240,180,.7),transparent 100%),
    radial-gradient(2px 3px at 9% 24%,rgba(255,240,180,.5),transparent 100%),
    radial-gradient(3px 4px at 14% 10%,rgba(255,200,80,.8),transparent 100%),
    radial-gradient(2px 3px at 24% 15%,rgba(200,255,255,.6),transparent 100%),
    radial-gradient(2px 3px at 29% 22%,rgba(255,200,80,.7),transparent 100%),
    radial-gradient(3px 4px at 34% 7%,rgba(255,240,180,.9),transparent 100%),
    radial-gradient(2px 3px at 39% 18%,rgba(200,255,255,.5),transparent 100%),
    radial-gradient(2px 3px at 44% 26%,rgba(255,230,100,.6),transparent 100%),
    radial-gradient(3px 3px at 50% 10%,rgba(255,200,80,.8),transparent 100%),
    radial-gradient(2px 3px at 55% 20%,rgba(255,240,180,.7),transparent 100%),
    radial-gradient(2px 3px at 60% 14%,rgba(200,255,255,.6),transparent 100%),
    radial-gradient(3px 4px at 64% 8%,rgba(255,240,180,.9),transparent 100%),
    radial-gradient(2px 3px at 69% 22%,rgba(255,200,80,.5),transparent 100%),
    radial-gradient(2px 3px at 74% 12%,rgba(200,255,255,.7),transparent 100%),
    radial-gradient(3px 4px at 79% 6%,rgba(255,240,180,.8),transparent 100%),
    radial-gradient(2px 3px at 84% 20%,rgba(255,230,100,.6),transparent 100%),
    radial-gradient(2px 3px at 88% 10%,rgba(255,200,80,.7),transparent 100%),
    radial-gradient(3px 3px at 93% 16%,rgba(200,255,255,.5),transparent 100%);
}

/* ── Background neon signs layer (distant street) ── */
.bg-neon-layer{position:absolute;left:0;right:0;top:10%;height:54%;z-index:3}

.bg-neon-sign{
  position:absolute;
  font-weight:900;letter-spacing:.1em;
  text-shadow:0 0 6px currentColor,0 0 16px currentColor;
  border:3px solid currentColor;
  box-shadow:0 0 14px currentColor,inset 0 0 10px currentColor;
  padding:4px 8px;background:rgba(2,2,18,.6);
  animation:neonFlicker 5s steps(1) infinite;
}
.bg-neon-sign:nth-child(1){left:2%;top:4%;color:var(--pink);font-size:clamp(.9rem,3.2vw,3.4rem);transform:rotate(-4deg)}
.bg-neon-sign:nth-child(2){left:1%;top:34%;color:var(--yellow);font-size:clamp(.7rem,1.8vw,2rem);transform:rotate(2deg);animation-delay:-2s}
.bg-neon-sign:nth-child(3){right:2%;top:6%;color:var(--cyan);font-size:clamp(.9rem,3.4vw,3.6rem);transform:rotate(5deg);animation-delay:-1.4s}
.bg-neon-sign:nth-child(4){right:1%;top:40%;color:var(--green);font-size:clamp(.7rem,2vw,2.2rem);transform:rotate(-3deg);animation-delay:-3.2s}
.bg-neon-sign:nth-child(5){left:50%;top:2%;transform:translateX(-50%) rotate(-1deg);color:var(--amber);font-size:clamp(1rem,3.6vw,3.8rem);animation-delay:-.8s}
.bg-neon-sign:nth-child(6){left:18%;top:38%;color:var(--pink);font-size:clamp(.6rem,1.6vw,1.8rem);animation-delay:-4s}
.bg-neon-sign:nth-child(7){right:14%;top:44%;color:var(--cyan);font-size:clamp(.6rem,1.6vw,1.8rem);animation-delay:-1.8s}

/* distant stall silhouettes */
.distant-stalls{
  position:absolute;left:0;right:0;bottom:14%;height:32%;z-index:2;
  background:
    linear-gradient(90deg,
      rgba(255,61,242,.18) 0 7%,transparent 7% 12%,
      rgba(30,248,255,.14) 12% 18%,transparent 18% 26%,
      rgba(255,224,80,.16) 26% 32%,transparent 32% 42%,
      rgba(255,61,242,.12) 42% 46%,transparent 46% 58%,
      rgba(30,248,255,.15) 58% 65%,transparent 65% 76%,
      rgba(255,100,24,.2) 76% 84%,transparent 84%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 44px),
    linear-gradient(180deg,transparent 0%,rgba(8,6,20,.8) 100%);
  clip-path:polygon(
    0 30%,4% 18%,8% 28%,12% 10%,16% 22%,22% 6%,28% 20%,32% 12%,
    38% 26%,44% 8%,50% 22%,55% 14%,60% 28%,66% 10%,72% 24%,78% 16%,
    84% 28%,90% 8%,96% 20%,100% 12%,100% 100%,0 100%);
  opacity:.82;
}

/* ── Moving people silhouettes ── */
.crowd{position:absolute;inset:auto 0 30%;height:14%;z-index:4}
.sil{position:absolute;bottom:0;background:#03020c;box-shadow:0 0 8px rgba(255,50,24,.3);animation:walkR 18s linear infinite}
.sil::before{content:"";position:absolute;top:-12px;left:50%;translate:-50% 0;width:10px;height:10px;background:#03020c;border-radius:50% 50% 0 0}
.sil.s1{width:10px;height:46px;left:-2%;animation-duration:22s}
.sil.s2{width:8px;height:38px;left:22%;animation-duration:16s;animation-delay:-7s;transform:scaleX(-1)}
.sil.s3{width:12px;height:52px;left:60%;animation-duration:28s;animation-delay:-14s}
.sil.s4{width:9px;height:42px;right:-2%;animation-duration:19s;animation-delay:-10s;transform:scaleX(-1)}

/* street dog */
.dog{
  position:absolute;left:8vw;bottom:26%;z-index:5;
  width:52px;height:18px;background:#04030d;
  box-shadow:0 0 8px rgba(255,100,30,.3);
  animation:walkR 20s linear infinite;
}
.dog::before{content:"";position:absolute;right:-14px;top:2px;width:16px;height:12px;background:#04030d}
.dog::after{
  content:"";position:absolute;left:6px;bottom:-8px;width:42px;height:8px;
  background:repeating-linear-gradient(90deg,#04030d 0 5px,transparent 5px 11px);
}

/* ══════════════════════════════════
   MAIN STALL STRUCTURE
══════════════════════════════════ */
.stall{
  position:absolute;
  left:50%;transform:translateX(-50%);
  z-index:20;
  width:min(1260px,98vw);
  top:4vh;
  bottom:0;
}

/* ── Corrugated metal roof ── */
.roof{
  position:absolute;left:0;right:0;top:0;height:22%;
  background:
    linear-gradient(105deg,rgba(255,255,255,.12) 0 18%,transparent 18% 100%),
    repeating-linear-gradient(90deg,
      #3e3b46 0 16px,#2c2a35 16px 32px,#4d4856 32px 36px,
      #3a3741 36px 56px,#28262f 56px 72px),
    linear-gradient(180deg,#5a5660 0,#202028 100%);
  clip-path:polygon(0 6%,100% 0%,100% 90%,0 100%);
  box-shadow:0 16px 36px rgba(0,0,0,.7),inset 0 -20px 28px rgba(0,0,0,.44);
}
.roof::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    /* rust patches */
    radial-gradient(circle at 22% 55%,rgba(140,55,20,.4) 0 18px,transparent 19px),
    radial-gradient(circle at 68% 38%,rgba(100,40,14,.3) 0 24px,transparent 25px),
    radial-gradient(circle at 80% 70%,rgba(160,70,25,.35) 0 14px,transparent 15px),
    /* red lantern ambient bleed from below */
    radial-gradient(ellipse at 50% 100%,rgba(255,72,22,.38),transparent 64%);
}

/* ── Red-white striped awning — exactly like the photos ── */
.awning-wrap{
  position:absolute;left:0;right:0;top:19.5%;z-index:32;
  height:11%;
}
.awning{
  width:100%;height:100%;
  background:repeating-linear-gradient(90deg,
    var(--stripe-w) 0 52px,var(--stripe-r) 52px 104px);
  clip-path:polygon(0 0,100% 0,97% 100%,3% 98%);
  box-shadow:0 18px 32px rgba(180,18,18,.5),inset 0 -10px rgba(0,0,0,.22);
}
.awning::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 50%,rgba(255,40,24,.44));
}

/* ── Bamboo/steel poles ── */
.pole{
  position:absolute;top:18%;bottom:16%;width:14px;z-index:22;
  background:repeating-linear-gradient(180deg,#6e4b22 0 24px,#25180c 24px 28px,#b07b30 28px 52px);
  box-shadow:5px 0 0 #20140a,0 0 18px rgba(255,80,22,.28);
}
.pole.pl{left:3.5%}
.pole.pr{right:3.5%}
.pole.pm{left:50%;margin-left:-7px}

/* ── Fluorescent tubes on ceiling ── */
.fluoro-group{position:absolute;left:6%;right:6%;top:20%;z-index:34;display:flex;gap:8%}
.fluoro{
  flex:1;height:10px;background:#deffff;
  box-shadow:0 0 6px #deffff,0 0 22px rgba(180,255,255,.65);
  animation:tubeFlicker 7s steps(1) infinite;
  transform:translateY(2px);
}
.fluoro:nth-child(2){animation-delay:-3s}
.fluoro:nth-child(3){animation-delay:-5s}

/* ══════════════════════════════════
   LAMP ROW
   Reference: dense cone/dome pendant lamps (photos 1&3) + round lanterns (photo 2)
══════════════════════════════════ */
.lamp-wire-row{
  position:absolute;left:3%;right:3%;top:18.8%;
  height:6px;z-index:40;
  background:linear-gradient(90deg,#1a0c06,#1a0c06);
  box-shadow:0 2px 4px rgba(0,0,0,.55);
}

.lamp-row{
  position:absolute;left:2%;right:2%;top:18.5%;
  height:180px;z-index:42;
  display:flex;align-items:flex-start;
  justify-content:space-evenly;
  pointer-events:none;
}

/* Dome/cone pendant lamps (like photo 1 & 3 — red dome industrial pendants) */
.dome-lamp{
  display:flex;flex-direction:column;align-items:center;
  transform-origin:50% 0;
  animation:sway 4s ease-in-out infinite;
  filter:drop-shadow(0 0 14px rgba(255,58,18,.8)) drop-shadow(0 0 34px rgba(255,90,22,.5));
}
.dome-lamp:nth-child(2n){animation-delay:-1.4s;animation-duration:5s}
.dome-lamp:nth-child(3n){animation-delay:-2.8s;animation-duration:3.8s}

.dl-wire{width:3px;height:clamp(16px,2.5vw,34px);background:#1a0c06;box-shadow:0 0 3px #ff6020}
.dl-body{
  position:relative;
  width:clamp(34px,4.8vw,58px);
  height:clamp(28px,4vw,48px);
  background:radial-gradient(circle at 50% 38%,#fff4c0 0 10%,#ffb030 12% 32%,#e83010 33% 72%,#8a1010 100%);
  clip-path:polygon(8% 0,92% 0,100% 62%,90% 100%,10% 100%,0 62%);
  box-shadow:inset 0 8px 0 rgba(255,220,80,.5),inset 0 -8px rgba(0,0,0,.3);
}
.dl-body::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:#c01010;border-top:2px solid #ff6030;
}
.dl-socket{width:clamp(12px,1.8vw,22px);height:clamp(6px,1vw,12px);background:#2a1806;border-top:3px solid #6a3010}

/* Round lanterns (like photo 2) interspersed */
.round-lamp{
  display:flex;flex-direction:column;align-items:center;
  transform-origin:50% 0;
  animation:sway 5.2s ease-in-out infinite;
  filter:drop-shadow(0 0 18px rgba(255,58,18,.9)) drop-shadow(0 0 48px rgba(255,100,24,.6));
}
.round-lamp:nth-child(2n){animation-delay:-2s;animation-duration:4.4s}

.rl-wire{width:3px;height:clamp(14px,2vw,26px);background:#1a0c06}
.rl-body{
  position:relative;
  width:clamp(30px,4.2vw,52px);
  height:clamp(32px,4.6vw,58px);
  background:
    radial-gradient(circle at 50% 44%,#fff8c0 0 8%,#ffcc40 9% 20%,#ff5418 21% 52%,#c01010 70%,#7a0808 100%),
    repeating-linear-gradient(90deg,rgba(100,0,0,.55) 0 3px,transparent 3px 12px);
  border:4px solid #800c10;
  border-radius:44% 44% 38% 38%;
  box-shadow:inset 0 0 16px #ffe070,0 0 36px 16px rgba(255,60,18,.5);
}
.rl-body::before,.rl-body::after{
  content:"";position:absolute;left:16%;right:16%;height:6px;background:#700c0c;
  box-shadow:inset 0 2px #ffaa28;
}
.rl-body::before{top:-7px}.rl-body::after{bottom:-7px}
.rl-tassel{width:6px;height:22px;background:repeating-linear-gradient(90deg,#d01214 0 2px,#ffaa28 2px 4px);margin-top:8px;box-shadow:0 0 6px rgba(255,70,20,.7)}

/* Warm red-amber glow pool under lamps */
.lamp-glow{
  position:absolute;left:0;right:0;top:21%;height:62%;z-index:20;
  pointer-events:none;
  background:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(255,80,20,.58),rgba(255,140,30,.22) 35%,transparent 70%);
  mix-blend-mode:screen;
}

/* ══════════════════════════════════
   HANGING ITEMS — from ceiling wires
   (white plastic bags + poultry like photos)
══════════════════════════════════ */
.hanging-wire{
  position:absolute;left:3%;right:3%;top:26%;height:5px;z-index:44;
  background:repeating-linear-gradient(90deg,#151018 0 58px,transparent 58px 62px);
}

.hangings{position:absolute;left:4%;right:4%;top:26%;height:26%;z-index:46;pointer-events:none}

/* Hanging plastic bags (white, like photo 1 & 3) */
.bag-hang{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
}
.bh-string{width:2px;height:clamp(12px,2vw,24px);background:#1a1218}
.bh-bag{
  width:clamp(22px,3vw,36px);
  height:clamp(30px,4.2vw,52px);
  background:rgba(230,240,244,.72);
  border:3px solid rgba(160,180,192,.5);
  clip-path:polygon(20% 0,80% 0,96% 22%,88% 100%,12% 100%,4% 22%);
  box-shadow:inset 0 8px rgba(255,255,255,.5);
}

/* Poultry/duck hanging (like photos) */
.duck-hang{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  animation:meatSway 6s ease-in-out infinite;transform-origin:50% 0;
  filter:drop-shadow(0 0 8px rgba(255,80,24,.3));
}
.dh-hook{width:3px;height:clamp(18px,2.8vw,36px);background:#231610}
.dh-body{
  width:clamp(28px,3.8vw,48px);
  height:clamp(52px,7.2vw,92px);
  background:linear-gradient(180deg,#e8c090 0,#c08840 35%,#884a24 68%,#5a2818 100%);
  clip-path:polygon(30% 0,72% 0,84% 18%,72% 34%,90% 68%,72% 100%,36% 100%,12% 68%,28% 36%,18% 18%);
  box-shadow:inset 6px 0 rgba(255,200,100,.28),inset -4px 0 rgba(0,0,0,.26);
}

/* Garlic/dried goods string */
.garlic-str{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  animation:meatSway 7s ease-in-out infinite reverse;
}
.garlic-str .bh-string{height:40px}
.garlic-clump{
  width:clamp(32px,4.4vw,56px);
  height:clamp(80px,11vw,140px);
  background:
    radial-gradient(circle at 28% 18%,#f2e6c0 0 9px,transparent 10px),
    radial-gradient(circle at 62% 28%,#d8c88a 0 10px,transparent 11px),
    radial-gradient(circle at 30% 42%,#f0e2b4 0 8px,transparent 9px),
    radial-gradient(circle at 66% 54%,#d0be80 0 11px,transparent 12px),
    radial-gradient(circle at 35% 68%,#ecceb0 0 9px,transparent 10px),
    radial-gradient(circle at 60% 80%,#c8ae74 0 10px,transparent 11px),
    linear-gradient(90deg,transparent 44%,#a81416 44% 58%,transparent 58%);
}

/* ══════════════════════════════════
   COUNTER + STALL CONTENTS
══════════════════════════════════ */
.counter-area{
  position:absolute;left:2%;right:2%;bottom:14%;z-index:50;height:36%;
  display:flex;gap:0;
}

/* Shared counter top style */
.counter-section{
  position:relative;flex:1;
  border-top:8px solid #7a6e60;
  border-left:6px solid #1c1612;
  border-right:6px solid #1c1612;
  background:
    /* water puddle shimmer */
    linear-gradient(180deg,rgba(200,240,255,.14),transparent 30%),
    repeating-linear-gradient(90deg,#3a2820 0 32px,#4e332a 32px 64px,#2e2018 64px 70px);
  box-shadow:0 -18px 40px rgba(255,60,20,.22),0 28px 42px rgba(0,0,0,.6);
}
.counter-section::after{
  /* dripping water edge */
  content:"";position:absolute;bottom:-22px;left:0;right:0;height:24px;
  background:
    repeating-linear-gradient(90deg,
      transparent 0 28px,rgba(200,240,255,.35) 28px 34px,transparent 34px 62px,
      rgba(200,240,255,.25) 62px 66px,transparent 66px 95px);
  animation:waterDrip 2.5s steps(3) infinite;
}

/* ICE TRAY — styrofoam box (Photo 1 big white boxes) */
.ice-tray{
  position:absolute;
  top:-22%;left:3%;right:3%;
  height:88%;
  background:linear-gradient(180deg,#f4f8f6,#d8eaee 52%,#8ab8c4);
  border:6px solid #3a5460;
  box-shadow:inset 0 0 22px rgba(200,240,255,.4),0 0 22px rgba(28,248,255,.2);
}
.ice-tray::before{
  content:"";position:absolute;
  inset:4px;
  background:
    radial-gradient(circle at 18% 34%,rgba(230,250,255,.8) 0 5px,transparent 6px),
    radial-gradient(circle at 44% 58%,rgba(220,248,255,.6) 0 7px,transparent 8px),
    radial-gradient(circle at 76% 38%,rgba(240,255,255,.7) 0 6px,transparent 7px),
    linear-gradient(180deg,rgba(240,255,255,.5),rgba(140,190,210,.3));
}
.ice-tray::after{
  /* steam/mist */
  content:"";position:absolute;left:-10%;right:-10%;top:-38%;height:50%;
  background:radial-gradient(ellipse,rgba(230,255,255,.5),transparent 70%);
  filter:blur(4px);
  animation:steamRise 6s ease-in-out infinite;
}

/* Fish on ice */
.fish{
  position:absolute;z-index:2;
  clip-path:polygon(0 50%,14% 8%,74% 10%,100% 0,92% 50%,100% 100%,74% 90%,14% 92%);
  border:3px solid #2a3a42;
}
.fish::before{content:"";position:absolute;right:24px;top:6px;width:5px;height:5px;background:#040812;border-radius:50%}
.fish.f1{width:clamp(72px,9vw,112px);height:clamp(24px,3vw,38px);left:8%;top:25%;background:linear-gradient(90deg,#c8dde4,#7a9298 52%,#e8c0a0);transform:rotate(-12deg)}

/* Rubber boots & plastic gloves */
.boots{

  background:linear-gradient(90deg,#151014 0 45%,transparent 45% 56%,#151014 56%);

}
.gloves{

  width:clamp(32px,4.4vw,58px);height:clamp(40px,5.4vw,72px);
  background:radial-gradient(circle at 40% 28%,#50e0e8,#20b8c0 55%,#0a8890);
  clip-path:polygon(18% 0,82% 0,100% 28%,90% 100%,58% 100%,50% 88%,42% 100%,8% 100%,0 28%);
  border:3px solid #0a6870;

/* Worker silhouette */
.worker{
  position:absolute;right:22%;bottom:0;z-index:55;
  width:clamp(28px,4vw,52px);height:clamp(80px,11vw,140px);
  background:#0e0c1a;

}
.worker::before{
  content:"";position:absolute;top:-clamp(18px,2.6vw,34px);left:50%;translate:-50% 0;
  width:clamp(18px,2.4vw,30px);height:clamp(18px,2.4vw,30px);

}
.worker-apron{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(40,180,200,.4) 0,rgba(20,150,170,.3) 100%);
}

/* ══════════════════════════════════
   CRT PC SETUP
══════════════════════════════════ */
.pc-wrap{
  position:absolute;
  left:50%;bottom:14%;
  z-index:70;
  width:min(680px,60vw);
  height:min(460px,50vh);
  transform:translateX(-50%);
  filter:drop-shadow(0 36px 32px rgba(0,0,0,.7)) drop-shadow(0 0 28px rgba(255,72,18,.28));
}

/* Wooden board / crate the PC sits on */
.pc-board{
  position:absolute;left:2%;right:4%;bottom:0;height:36px;
  background:linear-gradient(180deg,#a87840,#3a2416);
  border:5px solid #1e1208;
  transform:skewX(-4deg);
  box-shadow:0 0 18px rgba(255,70,20,.3);
}

/* Tower case */
.tower{
  position:absolute;right:1%;top:16%;
  width:19%;height:62%;
  background:
    linear-gradient(114deg,rgba(255,255,255,.22) 0 18%,transparent 18%),
    linear-gradient(180deg,#cac4b0,#7c7668);
  border:7px solid #3c362e;
  box-shadow:inset -14px 0 rgba(0,0,0,.2),0 0 20px rgba(255,72,20,.3);
  transform:rotate(1.5deg);
}
.tower::before{
  content:"";position:absolute;left:14%;top:10%;width:68%;height:16%;
  background:#2a2826;border:4px solid #524c44;
  box-shadow:0 38px 0 #262424,0 44px 0 #5a5248;
}
.tower::after{
  content:"";position:absolute;left:18%;bottom:12%;width:60%;height:26%;
  background:repeating-linear-gradient(0deg,#2e2a28 0 5px,#6e6660 5px 8px);
  border:3px solid #2e2a28;
}
/* ── Green START button on tower (pre-boot) ── */
.tower-light{
  position:absolute;right:14%;top:30%;
  width:clamp(14px,2vw,22px);height:clamp(14px,2vw,22px);
  background:radial-gradient(circle at 38% 34%,#a0ffc0,#20ff60 48%,#0aaa40);
  border-radius:50%;
  border:3px solid #096030;
  box-shadow:0 0 8px #20ff60,0 0 22px rgba(32,255,96,.7),0 0 48px rgba(32,255,96,.4);
  cursor:pointer;
  animation:startPulse 1.6s ease-in-out infinite;
  z-index:2;
  transition:transform .1s;
}
.tower-light:hover{transform:scale(1.15)}
.tower-light:active{transform:scale(.9)}
/* after boot: small indicator blink */
.tower-light.booted{
  width:10px;height:10px;
  background:#20ff60;border:2px solid #096030;
  box-shadow:0 0 5px #20ff60,0 0 12px rgba(32,255,96,.5);
  cursor:default;
  animation:blink 1.2s steps(1) infinite;
  top:34%;right:20%;
}

/* ── Red standby LED on monitor bezel ── */
.mon-led{
  position:absolute;right:26px;bottom:16px;
  width:8px;height:8px;
  background:#ff1a10;border-radius:50%;
  box-shadow:0 0 5px #ff3020,0 0 12px rgba(255,30,16,.6);
  animation:ledStandby 2.4s ease-in-out infinite;
  z-index:4;
}
.mon-led.on{
  background:#20ff60;
  box-shadow:0 0 5px #20ff60,0 0 12px rgba(32,255,96,.55);
  animation:none;
}

/* ── Screen off overlay (solid black glass look) ── */
.screen-off{
  position:absolute;inset:0;z-index:20;
  background:#000;
  border-radius:4px;
  pointer-events:none;
  transition:opacity 0s;
}
/* ── Boot instruction overlay ── */
.boot-hint{
  position:absolute;bottom:22%;left:50%;transform:translateX(-50%);
  z-index:30;pointer-events:none;
  text-align:center;
  font-family:"Courier New",monospace;
  font-size:clamp(7px,1.2vw,13px);
  line-height:1.9;
  color:#1aff6e;
  text-shadow:0 0 8px #1aff6e,0 0 20px rgba(26,255,110,.6);
  letter-spacing:.08em;
  white-space:nowrap;
}
.boot-hint.hidden{display:none}

/* Subtle CRT glass reflection when off */
.screen-off::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(130deg,rgba(255,255,255,.07) 0 14%,transparent 14%),
    radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.04),transparent 70%);
}

/* ── CRT power-on flash ── */
.crt-flash{
  position:absolute;inset:0;z-index:25;
  background:#fff;
  border-radius:4px;
  opacity:0;
  pointer-events:none;
  animation:none;
}
.crt-flash.flashing{
  animation:crtPowerOn .32s ease-out forwards;
}

@keyframes startPulse{
  0%,100%{box-shadow:0 0 8px #20ff60,0 0 22px rgba(32,255,96,.7),0 0 48px rgba(32,255,96,.4)}
  50%{box-shadow:0 0 14px #20ff60,0 0 38px rgba(32,255,96,.9),0 0 72px rgba(32,255,96,.6)}
}
@keyframes ledStandby{
  0%,100%{opacity:1}
  50%{opacity:.28}
}
@keyframes crtPowerOn{
  0%{opacity:1}
  18%{opacity:.7}
  35%{opacity:.95}
  100%{opacity:0}
}

/* Monitor */
.monitor{
  position:absolute;left:8%;top:2%;
  width:68%;height:78%;
  transform:rotate(-1.5deg);
}
.mon-shell{
  position:absolute;inset:0;
  background:
    linear-gradient(138deg,rgba(255,255,255,.3) 0 18%,transparent 18%),
    linear-gradient(180deg,#d0cab8,#948a78 56%,#585248);
  border:9px solid #363028;
  border-radius:10px 10px 22px 22px;
  box-shadow:
    inset -18px -20px rgba(0,0,0,.22),
    inset 10px 8px rgba(255,255,255,.2),
    0 0 44px rgba(255,72,18,.42),
    0 0 80px rgba(255,72,18,.2);
}
.mon-shell::after{
  content:"";position:absolute;right:18px;bottom:14px;
  width:78px;height:26px;
  background:repeating-linear-gradient(90deg,#302a26 0 8px,#5a524a 8px 12px);
  border:3px solid #302a26;
}
.mon-base{
  position:absolute;left:31%;bottom:1%;width:30%;height:14%;
  background:linear-gradient(180deg,#948a78,#443c34);
  border:6px solid #302a28;
  clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);
}

/* Screen */
.screen{
  position:absolute;left:7%;top:9%;width:76%;height:70%;
  background:#080a0c;
  border:8px solid #484038;
  border-radius:8px;
  box-shadow:inset 0 0 20px #000,0 0 22px rgba(32,250,255,.22);
  overflow:hidden;
}
.doom-iframe{
  position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);
  border:0;background:#0a0808;transform:scale(1.025);
}
/* Scanlines on screen */
.screen::before{
  content:"";position:absolute;inset:0;z-index:10;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.38) 0 2px,rgba(255,255,255,.04) 2px 4px),
    radial-gradient(ellipse at 50% 46%,transparent 0 52%,rgba(0,0,0,.6) 100%);
  animation:crtFlicker .14s steps(2) infinite;
}
/* water droplets on screen */
.screen::after{
  content:"";position:absolute;inset:0;z-index:11;pointer-events:none;
  background:
    radial-gradient(circle at 18% 16%,rgba(255,255,255,.5) 0 3px,transparent 4px),
    radial-gradient(circle at 83% 24%,rgba(255,255,255,.4) 0 4px,transparent 5px),
    radial-gradient(circle at 64% 78%,rgba(255,255,255,.35) 0 3px,transparent 4px),
    radial-gradient(circle at 38% 66%,rgba(255,255,255,.28) 0 2px,transparent 3px),
    linear-gradient(180deg,transparent 35%,rgba(210,240,255,.14) 36% 37%,transparent 40%);
}

/* Keyboard */
.keyboard{
  position:absolute;left:8%;bottom:4%;width:52%;height:12%;
  background:
    repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,0,0,.3) 14px 17px),
    repeating-linear-gradient(0deg,transparent 0 11px,rgba(0,0,0,.26) 11px 14px),
    #9a9080;
  border:5px solid #302a26;
  transform:perspective(200px) rotateX(32deg) rotate(-2deg);
  box-shadow:0 10px 0 rgba(0,0,0,.4);
}
/* Mouse */
.mouse{
  position:absolute;right:19%;bottom:7%;width:clamp(38px,5vw,56px);height:clamp(28px,3.8vw,42px);
  background:linear-gradient(180deg,#c2baa8,#726a5e);
  border:4px solid #302a26;border-radius:44% 44% 34% 34%;
}
.mouse::before{
  content:"";position:absolute;left:18px;top:0;bottom:0;width:3px;background:#302a26;
}
/* Mouse wire */
.mouse::after{
  content:"";position:absolute;left:50%;top:-32px;
  width:80px;height:36px;
  border-bottom:4px solid #101010;
  border-left:4px solid transparent;
  border-radius:0 0 0 50%;
  transform:rotate(-10deg);
}
/* Tangled keyboard cable */
.kb-wire{
  position:absolute;left:36%;bottom:10%;width:200px;height:82px;z-index:3;
  border:4px solid transparent;
  border-bottom-color:#0e0e0e;border-left-color:#0e0e0e;
  border-radius:50%;transform:rotate(-6deg);
  opacity:.8;
}
.kb-wire::before{
  content:"";position:absolute;left:26px;top:10px;width:118px;height:50px;
  border:3px solid transparent;border-bottom-color:#111;border-right-color:#111;border-radius:50%;
}

/* ══════════════════════════════════
   STEAM / MIST
══════════════════════════════════ */
.steam-cloud{
  position:absolute;pointer-events:none;z-index:68;
  filter:blur(2px);opacity:0;
}
.steam-cloud.sc-ice{
  left:8%;bottom:36%;width:40%;height:36%;
  background:
    radial-gradient(ellipse at 22% 76%,rgba(220,248,255,.6),transparent 28%),
    radial-gradient(ellipse at 56% 58%,rgba(200,240,255,.5),transparent 32%),
    radial-gradient(ellipse at 80% 44%,rgba(180,255,255,.42),transparent 28%);
  animation:steamPuff 7s ease-in-out infinite;
}
.steam-cloud.sc-monitor{
  left:18%;bottom:44%;width:34%;height:28%;
  background:radial-gradient(ellipse at 50% 70%,rgba(200,240,255,.42),transparent 60%);
  animation:steamPuff 5.4s ease-in-out infinite;animation-delay:-2.8s;
}
.steam-cloud.sc-right{
  right:6%;bottom:38%;width:26%;height:28%;
  background:radial-gradient(ellipse at 40% 72%,rgba(240,220,200,.4),transparent 55%);
  animation:steamPuff 8s ease-in-out infinite;animation-delay:-4s;
}

/* ══════════════════════════════════
   FLOOR + PUDDLES
══════════════════════════════════ */
.floor-area{
  position:absolute;left:-8%;right:-8%;bottom:-6%;height:38%;z-index:12;
  background:
    /* lantern warm reflection */
    radial-gradient(ellipse 60% 38% at 50% 18%,rgba(255,78,24,.34),transparent 65%),
    /* neon splashes */
    radial-gradient(ellipse 18% 22% at 12% 32%,rgba(255,61,242,.28),transparent 60%),
    radial-gradient(ellipse 18% 22% at 88% 28%,rgba(30,248,255,.24),transparent 60%),
    /* base floor */
    linear-gradient(180deg,rgba(14,12,22,.7) 0,#040308 80%),
    repeating-linear-gradient(90deg,#0e0c18 0 58px,#080612 58px 62px,#120e1c 62px 120px);
  transform:perspective(380px) rotateX(58deg);
  transform-origin:top;
}

.puddle{
  position:absolute;z-index:14;height:clamp(10px,1.6vh,22px);
  border-radius:4px 6px 4px 6px;
  transform:skewX(-18deg);
  animation:ripple 3.2s steps(2) infinite;
}
.puddle::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:inherit;filter:blur(.5px);opacity:.5;transform:scaleY(.4) translateY(80%);
}
/* lantern reflection puddle */
.puddle.pu1{
  left:18%;bottom:7%;width:26%;
  background:linear-gradient(90deg,
    transparent 0 5%,rgba(255,60,20,.6) 5% 24%,rgba(255,61,242,.48) 28%,
    rgba(30,248,255,.44) 48%,rgba(255,224,70,.4) 68%,transparent 84%);
}
.puddle.pu2{
  right:14%;bottom:12%;width:30%;
  background:linear-gradient(90deg,
    rgba(30,248,255,.5) 0 18%,rgba(255,61,242,.4) 22%,
    rgba(255,60,20,.58) 38% 62%,rgba(255,224,70,.36) 70%,transparent);
  animation-delay:-1.4s;
}
.puddle.pu3{
  left:44%;bottom:2%;width:22%;
  background:linear-gradient(90deg,transparent 0 8%,rgba(255,60,20,.52) 8% 48%,rgba(30,248,255,.38) 58%,transparent);
  animation-delay:-2.6s;
}

/* ══════════════════════════════════
   RAIN
══════════════════════════════════ */
.rain{
  position:absolute;inset:-24% 0 0;z-index:160;pointer-events:none;
  background:
    repeating-linear-gradient(100deg,
      transparent 0 16px,rgba(190,240,255,.2) 16px 19px,transparent 19px 44px),
    repeating-linear-gradient(100deg,
      transparent 0 48px,rgba(255,160,100,.12) 48px 51px,transparent 51px 88px);
  animation:rainFall .85s linear infinite;
  opacity:.5;
}

/* ══════════════════════════════════
   KEYFRAMES
══════════════════════════════════ */
@keyframes sway{
  0%,100%{transform:rotate(-4deg)}
  50%{transform:rotate(5deg)}
}
@keyframes meatSway{
  0%,100%{transform:rotate(-2deg)}
  50%{transform:rotate(3.5deg)}
}
@keyframes neonFlicker{
  0%,7%,9%,100%{opacity:1}
  8%{opacity:.35}
  54%{opacity:.78}
  55%{opacity:1}
  72%{opacity:.52}
  73%{opacity:.96}
}
@keyframes tubeFlicker{
  0%,86%,90%,100%{opacity:1}
  87%,89%{opacity:.2}
}
@keyframes crtFlicker{
  0%{opacity:.72;transform:translateY(0)}
  100%{opacity:.94;transform:translateY(1px)}
}
@keyframes steamPuff{
  0%{opacity:0;transform:translate(-10px,20px) scale(.9)}
  30%{opacity:.78}
  70%{opacity:.6}
  100%{opacity:0;transform:translate(24px,-32px) scale(1.18)}
}
@keyframes rainFall{
  from{transform:translate3d(0,-60px,0)}
  to{transform:translate3d(-44px,72px,0)}
}
@keyframes ripple{
  0%,100%{filter:blur(.2px) brightness(1);transform:skewX(-18deg) scaleX(1)}
  50%{filter:blur(.6px) brightness(1.24);transform:skewX(-16deg) scaleX(1.06)}
}
@keyframes walkR{

<script>
(function(){
  var btn    = document.getElementById('startBtn');
  var led    = document.getElementById('monLed');
  var screen = document.getElementById('crtScreen');
  var off    = document.getElementById('screenOff');
  var flash  = document.getElementById('crtFlash');
  var booted = false;

  btn.addEventListener('click', function(){
    if(booted) return;
    booted = true;

    /* 1. Button becomes a small blink indicator */
    btn.classList.add('booted');
    btn.removeAttribute('role');
    btn.removeAttribute('title');

    /* 2. LED switches to green "on" */
    led.classList.add('on');

    /* 3. Brief white CRT power-on flash */
    flash.classList.add('flashing');

    /* 4. After flash (~200ms) → remove black overlay + inject iframe */
    setTimeout(function(){
      off.style.display = 'none';
      flash.style.display = 'none';

      var iframe = document.createElement('iframe');
      iframe.className = 'doom-iframe';
      iframe.title = 'WebDOOM — running inside CRT monitor in Hong Kong wet market';
      iframe.src = 'https://ustymukhman.github.io/WebDOOM/public/';
      iframe.allow = 'autoplay; fullscreen; gamepad; keyboard-map';
      screen.appendChild(iframe);
      document.getElementById('bootHint').classList.add('hidden');
    }, 220);
  });
})();
</script>
